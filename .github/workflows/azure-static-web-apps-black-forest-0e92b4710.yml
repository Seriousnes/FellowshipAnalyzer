name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve .NET SDK version
        id: dotnet
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-tools workload
        id: cache-wasm-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-manifests
            ~/.dotnet/packs
            ~/.dotnet/metadata
            ~/.dotnet/library-packs
          key: dotnet-workload-wasm-tools-${{ runner.os }}-${{ steps.dotnet.outputs.version }}

      - name: Install wasm-tools workload
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish Blazor WebAssembly (standalone)
        run: |
          dotnet publish src/FellowshipAnalyzer/FellowshipAnalyzer/FellowshipAnalyzer.csproj \
            -c Release \
            -o publish/static

      - name: Publish Functions API
        run: |
          dotnet publish src/FellowshipAnalyzer/FellowshipAnalyzer.Api/FellowshipAnalyzer.Api.csproj \
            -c Release \
            -o publish/api

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_FOREST_0E92B4710 }}
          action: "upload"
          app_location: "publish/static/wwwroot"
          api_location: "publish/api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
