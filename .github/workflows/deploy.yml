name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  API_PROJECT: src/FellowshipAnalyzer/FellowshipAnalyzer.Api/FellowshipAnalyzer.Api.csproj
  CLIENT_PROJECT: src/FellowshipAnalyzer/FellowshipAnalyzer.Client/FellowshipAnalyzer.Client.csproj

jobs:
  deployment-disabled:
    name: Deployment disabled
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AZURE_DEPLOYMENTS != 'true' }}

    steps:
      - name: Explain deployment gate
        run: echo "Set repository variable ENABLE_AZURE_DEPLOYMENTS=true after configuring Azure secrets and variables."

  configure-static-web-app:
    name: Configure Static Web App
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AZURE_DEPLOYMENTS == 'true' }}
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure managed API application settings
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          FELLOWSHIPLOGS_CLIENT_ID: ${{ secrets.FELLOWSHIPLOGS_CLIENT_ID }}
          FELLOWSHIPLOGS_CLIENT_SECRET: ${{ secrets.FELLOWSHIPLOGS_CLIENT_SECRET }}
          FELLOWSHIPLOGS_TOKEN_ENDPOINT: ${{ vars.FELLOWSHIPLOGS_TOKEN_ENDPOINT }}
          FELLOWSHIPLOGS_GRAPHQL_ENDPOINT: ${{ vars.FELLOWSHIPLOGS_GRAPHQL_ENDPOINT }}
          PROXY_RATE_LIMIT_PERMIT_LIMIT: ${{ vars.PROXY_RATE_LIMIT_PERMIT_LIMIT }}
          PROXY_RATE_LIMIT_QUEUE_LIMIT: ${{ vars.PROXY_RATE_LIMIT_QUEUE_LIMIT }}
          PROXY_RATE_LIMIT_WINDOW: ${{ vars.PROXY_RATE_LIMIT_WINDOW }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_RESOURCE_GROUP)) { throw "Set repository variable AZURE_RESOURCE_GROUP." }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_STATIC_WEB_APP_NAME)) { throw "Set repository variable AZURE_STATIC_WEB_APP_NAME." }
          if ([string]::IsNullOrWhiteSpace($env:FELLOWSHIPLOGS_CLIENT_ID)) { throw "Set secret FELLOWSHIPLOGS_CLIENT_ID." }
          if ([string]::IsNullOrWhiteSpace($env:FELLOWSHIPLOGS_CLIENT_SECRET)) { throw "Set secret FELLOWSHIPLOGS_CLIENT_SECRET." }

          Write-Output "::add-mask::$env:FELLOWSHIPLOGS_CLIENT_ID"
          Write-Output "::add-mask::$env:FELLOWSHIPLOGS_CLIENT_SECRET"

          $settings = @(
            "FUNCTIONS_WORKER_RUNTIME=dotnet-isolated",
            "FellowshipLogs__ClientId=$env:FELLOWSHIPLOGS_CLIENT_ID",
            "FellowshipLogs__ClientSecret=$env:FELLOWSHIPLOGS_CLIENT_SECRET"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:FELLOWSHIPLOGS_TOKEN_ENDPOINT)) {
            $settings += "FellowshipLogs__TokenEndpoint=$env:FELLOWSHIPLOGS_TOKEN_ENDPOINT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:FELLOWSHIPLOGS_GRAPHQL_ENDPOINT)) {
            $settings += "FellowshipLogs__GraphQlEndpoint=$env:FELLOWSHIPLOGS_GRAPHQL_ENDPOINT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PROXY_RATE_LIMIT_PERMIT_LIMIT)) {
            $settings += "FellowshipLogsProxy__RateLimit__PermitLimit=$env:PROXY_RATE_LIMIT_PERMIT_LIMIT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PROXY_RATE_LIMIT_QUEUE_LIMIT)) {
            $settings += "FellowshipLogsProxy__RateLimit__QueueLimit=$env:PROXY_RATE_LIMIT_QUEUE_LIMIT"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:PROXY_RATE_LIMIT_WINDOW)) {
            $settings += "FellowshipLogsProxy__RateLimit__Window=$env:PROXY_RATE_LIMIT_WINDOW"
          }

          az staticwebapp appsettings set `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_STATIC_WEB_APP_NAME `
            --setting-names $settings `
            --output none

  deploy-static-web-app:
    name: Deploy Static Web App
    runs-on: ubuntu-latest
    needs: configure-static-web-app
    if: ${{ vars.ENABLE_AZURE_DEPLOYMENTS == 'true' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate static client configuration
        shell: pwsh
        run: |
          $configPath = "src/FellowshipAnalyzer/FellowshipAnalyzer.Client/wwwroot/config.json"
          $apiBaseUrl = "/"

          $config = @{ apiBaseUrl = $apiBaseUrl } | ConvertTo-Json -Compress
          Set-Content -Path $configPath -Value $config -Encoding utf8

      - name: Publish static client
        run: >-
          dotnet publish ${{ env.CLIENT_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          -p:StandaloneWasmHost=true
          --output ./publish/static

      - name: Publish managed API
        run: >-
          dotnet publish ${{ env.API_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --output ./publish/api

      - name: Validate Static Web Apps artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/static/wwwroot/index.html")) {
            throw "Static Web Apps deployment requires a standalone Blazor WebAssembly host page at wwwroot/index.html. The current client project does not publish one yet."
          }
          if (-not (Test-Path "publish/static/wwwroot/config.json")) {
            throw "Static Web Apps deployment requires config.json in the published wwwroot."
          }
          if (-not (Test-Path "publish/static/wwwroot/staticwebapp.config.json")) {
            throw "Static Web Apps deployment requires staticwebapp.config.json in the published wwwroot."
          }
          if (-not (Test-Path "publish/api/host.json")) {
            throw "Static Web Apps managed API deployment requires host.json in the published API artifact."
          }

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/static/wwwroot
          api_location: publish/api
          skip_app_build: true
          skip_api_build: true
