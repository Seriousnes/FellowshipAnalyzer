name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Restore solution
        run: dotnet restore FellowshipAnalyzer.slnx -p:RunAOTCompilation=false

      - name: Build solution
        run: dotnet build FellowshipAnalyzer.slnx --configuration Release --no-restore -p:RunAOTCompilation=false

  discover:
    name: Discover test projects
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Discover test projects
        id: discover
        run: bash .github/scripts/discover-tests.sh FellowshipAnalyzer.slnx

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: discover

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Restore test project
        run: dotnet restore ${{ matrix.project }} -p:RunAOTCompilation=false

      - name: Run tests
        run: >-
          dotnet test ${{ matrix.project }}
          --configuration Release
          --no-restore
          -p:RunAOTCompilation=false
          --logger "trx;LogFileName=${{ matrix.name }}.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/*.trx
          if-no-files-found: ignore
