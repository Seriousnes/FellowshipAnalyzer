<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fellowship Analyzer">
  <defs>
    <clipPath id="bottomCrop" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="56"/>
    </clipPath>
    <clipPath id="arcClip" clipPathUnits="userSpaceOnUse">
      <circle cx="32" cy="33.66" r="29.66"/>
    </clipPath>
    <clipPath id="diamondClip" clipPathUnits="userSpaceOnUse">
      <polygon points="42.5,0 64,0 64,64 15.1,64"/>
    </clipPath>
    <linearGradient id="arcGradientLeft" gradientUnits="userSpaceOnUse"
                    x1="32" y1="4" x2="8.52" y2="58">
      <stop offset="0"    stop-color="#f4e9d0"/>
      <stop offset="0.68" stop-color="#f4e9d0"/>
      <stop offset="0.82" stop-color="#d4a744"/>
      <stop offset="1"    stop-color="#d4a744"/>
    </linearGradient>
    <linearGradient id="arcGradientRight" gradientUnits="userSpaceOnUse"
                    x1="32" y1="4" x2="55.48" y2="58">
      <stop offset="0"    stop-color="#f4e9d0"/>
      <stop offset="0.68" stop-color="#f4e9d0"/>
      <stop offset="0.82" stop-color="#d4a744"/>
      <stop offset="1"    stop-color="#d4a744"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#bottomCrop)">

  <!-- Cream gradient arc: stroke-width=5, outer edge at y=4 (apex) -->
  <path d="M 14 54
           A 27.16 27.16 0 0 1 32 6.5"
        fill="none"
        stroke="url(#arcGradientLeft)"
        stroke-width="5"
        stroke-linecap="butt"/>
  <path d="M 32 6.5
           A 27.16 27.16 0 0 1 50 54"
        fill="none"
        stroke="url(#arcGradientRight)"
        stroke-width="5"
        stroke-linecap="butt"/>

  <!-- Outer gold border: a circle at r=28.6 whose outer edge aligns with the
       cream arc's outer edge (r=27.6+1.5=29.1). bottomCrop clips the bottom;
       the chevron drawn after covers the inner portion. -->
  <circle cx="32" cy="33.66" r="29.51"
          fill="none"
          stroke="#d4a744"
          stroke-width="0.3"/>

  <path d="M 32 4
           L 55.48 58
           L 47.43 58
           L 32 22
           L 16.57 58
           L 8.52 58
           Z"
        fill="#d4a744"
        clip-path="url(#arcClip)"/>

  <polygon points="34.83,31.17 39.07,41.07 29.17,36.83 24.93,26.93"
           fill="#f4e9d0"
           clip-path="url(#diamondClip)"/>
  </g>
</svg>
