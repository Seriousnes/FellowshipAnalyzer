<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellowship Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <base href="/" />
    <link rel="preload" href="css/splash.css" as="style" />
    <link rel="stylesheet" href="css/splash.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Noto+Sans:wght@400&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.45.0/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="FellowshipAnalyzer.styles.css" />
</head>

<body>
    <div id="app">
        <div class="fa-splash" id="fa-splash">
            <h1 class="fa-splash-brand">Fellowship Analyzer</h1>
            <p class="fa-splash-tagline">Combat log analysis for Fellowship</p>
            <div class="fa-splash-bar" id="fa-splash-bar" role="progressbar"
                 aria-label="Loading application" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="fa-splash-bar-fill" id="fa-splash-bar-fill"></div>
            </div>
            <div class="fa-splash-status" id="fa-splash-status">Loading runtime…</div>
        </div>
    </div>
    <script src="js/splash.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
</body>

</html>
