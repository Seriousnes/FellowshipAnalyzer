<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellowship Analyzer</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Noto+Sans:wght@400&display=swap" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="FellowshipAnalyzer.Client.styles.css" />
    <style>
        /* Inline splash styles so the loading screen is visible before app.css downloads. */
        .fa-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background: #0c0e18;
            color: #e2dfd8;
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            z-index: 9999;
            transition: opacity 250ms ease-out;
        }
        .fa-splash--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .fa-splash__brand {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #f0d078;
            text-shadow: 0 0 24px rgba(212, 167, 68, 0.25);
            margin: 0;
        }
        .fa-splash__tagline {
            font-family: 'Noto Sans', system-ui, sans-serif;
            font-size: 0.95rem;
            color: #9a9586;
            margin: -0.75rem 0 0;
        }
        .fa-splash__bar {
            position: relative;
            width: min(360px, 70vw);
            height: 6px;
            border-radius: 999px;
            background: rgba(212, 167, 68, 0.14);
            overflow: hidden;
        }
        .fa-splash__bar::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #d4a744 40%, #f0d078 60%, transparent);
            animation: fa-splash-slide 1.4s ease-in-out infinite;
        }
        .fa-splash__status {
            font-family: 'Noto Sans', system-ui, sans-serif;
            font-size: 0.8rem;
            color: #6b6558;
            letter-spacing: 0.04em;
            min-height: 1em;
        }
        @keyframes fa-splash-slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .fa-splash__bar::after {
                animation: none;
                width: 100%;
                background: #d4a744;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="fa-splash" id="fa-splash">
            <h1 class="fa-splash__brand">Fellowship Analyzer</h1>
            <p class="fa-splash__tagline">Combat log analysis for Fellowship</p>
            <div class="fa-splash__bar" role="progressbar" aria-label="Loading application"></div>
            <div class="fa-splash__status" id="fa-splash-status">Loading runtime…</div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            var status = document.getElementById('fa-splash-status');
            var loaded = 0;
            function setStatus(text) {
                if (status) status.textContent = text;
            }
            Blazor.start({
                loadBootResource: function (type, name) {
                    loaded++;
                    if (type === 'dotnetjs' || type === 'dotnetwasm') {
                        setStatus('Loading runtime…');
                    } else if (type === 'assembly' || type === 'pdb') {
                        setStatus('Loading assemblies (' + loaded + ')…');
                    } else {
                        setStatus('Loading resources (' + loaded + ')…');
                    }
                    return null; // let the framework fetch with default URL
                }
            }).then(function () {
                setStatus('Starting…');
                var splash = document.getElementById('fa-splash');
                if (splash) {
                    splash.classList.add('fa-splash--hidden');
                    setTimeout(function () { splash.remove(); }, 300);
                }
            }).catch(function (err) {
                setStatus('Failed to start: ' + (err && err.message ? err.message : err));
                console.error(err);
            });
        })();
    </script>
</body>

</html>
