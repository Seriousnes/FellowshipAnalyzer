query GetReportMasterData($code: String!, $fightIDs: [Int], $includeFight: Boolean!) {
  reportData {
    report(code: $code) {
      title
      startTime
      endTime
      fights {
        id
        name
        encounterID
        kill
        startTime
        endTime
        difficulty
        friendlyPlayers
        inProgress
        fightPercentage
      }
      targetFight: fights(fightIDs: $fightIDs) @include(if: $includeFight) {
        id
        enemyNPCs {
          id
          gameID
          instanceCount
          groupCount
          petOwner
        }
        dungeonPulls {
          id
          encounterID
          kill
          startTime
          endTime
          name
          enemyNPCs {
            id
            gameID
            minimumInstanceID
            maximumInstanceID
            minimumInstanceGroupID
            maximumInstanceGroupID
          }
        }
      }
      masterData {
        abilities {
          gameID
          name
          icon
          type
        }
        actors {
          id
          name
          type
          subType
          server
          icon
        }
      }
    }
  }
}
