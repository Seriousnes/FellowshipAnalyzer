query GetEvents($code: String!, $fightIDs: [Int], $sourceID: Int!) {
  reportData {
    report(code: $code) {
      fights(fightIDs: $fightIDs) {
        inProgress
        startTime
        dungeonPulls {
          encounterID
          startTime
          endTime
          name
        }
      }
      events(fightIDs: $fightIDs, sourceID: $sourceID, includeResources: true) {
        data
      }
    }
  }
}
