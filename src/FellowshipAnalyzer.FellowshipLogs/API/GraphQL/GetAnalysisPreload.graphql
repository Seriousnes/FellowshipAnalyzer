query GetAnalysisPreload($code: String!) {
  reportData {
    report(code: $code) {
      title
      startTime
      endTime
      fights {
        id
        name
        encounterID
        kill
        startTime
        endTime
        difficulty
        friendlyPlayers
        inProgress
        fightPercentage
        dungeonPulls {
          encounterID
          startTime
          endTime
          name
        }
      }
      masterData {
        abilities {
          gameID
          name
          icon
          type
        }
        actors {
          id
          name
          type
          subType
          server
          icon
        }
      }
    }
  }
}
